  <style>

    *{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--purple);outline-offset:2px}input,select{background:#10111b;border:1px solid #36364a;border-radius:13px;padding:12px 13px;color:var(--text);width:100%;min-width:0}input[type=date]{color-scheme:dark}input::placeholder{color:#72718a}select{appearance:auto}label{font-size:12px;color:var(--muted);font-weight:700;display:grid;gap:7px}h1,h2,h3,p{margin:0}h1{font-size:28px;letter-spacing:-1px}h2{font-size:18px;letter-spacing:-.4px}h3{font-size:15px}p{line-height:1.5}.app{max-width:560px;min-height:100dvh;margin:auto;position:relative;padding-bottom:calc(93px + env(safe-area-inset-bottom));background:radial-gradient(circle at 83% 0,#38215b38,transparent 340px),var(--bg)}.page{padding:24px 20px 20px;animation:appear .2s ease}@keyframes appear{from{opacity:.7;transform:translateY(5px)}to{opacity:1;transform:none}}.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:25px}.brand{display:flex;align-items:center;gap:11px}.logo{width:47px;height:47px;border-radius:16px;display:grid;place-items:center;font-weight:950;letter-spacing:-1.5px;font-size:19px;color:white;background:linear-gradient(145deg,#b08cff,#6044d1);box-shadow:0 7px 24px #7151e85a}.brand b{display:block;font-size:14px;letter-spacing:.2px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.avatar{height:41px;width:41px;border-radius:50%;background:#252037;color:var(--purple);font-weight:800;display:grid;place-items:center;border:1px solid #524170}.eyebrow{text-transform:uppercase;letter-spacing:1.7px;color:var(--purple);font- :560px;width:100%;padding:11px 12px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);background:#11111ded;backdrop-filter:blur(18px);border-top:1px solid #2b2a40;gap:3px}.nav button{min-width:0;background:transparent;border:0;color:#86839e;display:flex;flex-direction:column;gap:4px;align-items:center;padding:6px 1px;font-size:10px;font-weight:700}.nav button.active{color:#ba9cff}.nav .ico{font-size:21px;line-height:23px}.datebar{display:flex;align-items:center;justify-content:space-between;margin-top:17px;margin-bottom:19px}.date-pill{border:1px solid #37354c;background:#1d1c2c;color:white;padding:10px 12px;border-radius:12px;font-size:12px;font-weight:750}.arrowbtn{background:#232235;border:1px solid #36334c;color:#c9b7ff;padding:8px 12px;border-radius:10px}.exercise{background:#1a1b2a;border:1px solid #303047;border-radius:17px;padding:14px;margin:11px 0}.exercise-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.setrow{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:8px;align-items:center;margin-top:10px}.setrow input{text-align:center;padding:10px 5px;border-radius:10px;font-size:13px}.setrow .setno{text-align:center;color:var(--muted);font-weight:800;font-size:12px}.setcheck{border:1px solid #4f456b;border-radius:10px;width:36px;height:37px;background:#2a2940;color:#ad9bc8}.setcheck.done{background:#358d7d;border-color:#55c2ae;color:white}.setlabel{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:8px;font-size:10px;color:var(--muted);text-align:center;margin-top:13px}.tabs{display:flex;gap:7px;overflow:auto;scrollbar-width:none;margin:15px 0 20px}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:none;border:1px solid #3c3850;background:#1e1d2e;border-radius:11px;padding:9px 12px;color:var(--muted);font-size:12px;font-weight:800}.tabs button.active{background:#48346f;color:#e9ddff;border-color:#775ac3}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal-dow{font-size:10px;color:#7f7d95;text-align:center;margin:5px 0}.cal-day{border:1px solid transparent;border-radius:12px;background:#1d1d2c;color:#d6d4ea;aspect-ratio:1;display:grid;place-items:center;font-size:12px;font-weight:800;position:relative}.cal-day:disabled{background:transparent}.cal-day.today{border-color:#7655ba}.cal-day.selected{background:#8d66e5;color:#0f0b1d}.cal-day.dot:after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;transform:translateX(-50%);background:#68e3d0;border-radius:100%}.cal-day.selected:after{background:white}.form{display:grid;gap:14px}.formline{display:grid;grid-template-columns:1fr 1fr;gap:11px}.chipselect{display:flex;gap:7px;flex-wrap:wrap}.chipselect button{border:1px solid #3b3852;background:#1c1c2b;color:#aaa5c2;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:800}.chipselect button.active{background:#48346f;color:#fff;border-color:#9568ed}.overlay{position:fixed;z-index:50;inset:0;display:flex;align-items:end;justify-content:center;background:#000b;padding-top:20px}.sheet{background:#191927;border-radius:25px 25px 0 0;border:1px solid #44405c;width:100%;max-width:560px;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;padding:21px 20px calc(25px + env(safe-area-inset-bottom));box-shadow:0 -20px 75px #000a}.sheetheader{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}.iconbtn{border:1px solid #3d394f;background:#282539;color:#ddd1ff;width:35px;height:35px;display:grid;place-items:center;border-radius:10px;font-size:18px}.empty{display:grid;justify-items:center;text-align:center;gap:9px;color:var(--muted);padding:32px 12px}.empty .symbol{font-size:35px}.empty b{color:white;font-size:14px}.notice{font-size:11px;line-height:1.6;color:var(--muted)}.chart{display:flex;align-items:end;gap:8px;height:120px;padding-top:12px}.barwrap{display:grid;flex:1;gap:8px;justify-items:center;align-items:end;height:100%}.bar{width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(0deg,#6f4dc8,#af86ff);min-height:4px}.barlabel{font-size:10px;color:var(--muted)}.linechart{width:100%;height:155px;display:block}.toast{position:fixed;z-index:90;left:50%;bottom:calc(95px + env(safe-area-inset-bottom));transform:translateX(-50%);color:white;border:1px solid #5a4579;background:#2c2443;padding:11px 16px;border-radius:14px;max-width:calc(100% - 30px);text-align:center;font-size:12px;box-shadow:0 10px 40px #0008;pointer-events:none}.space{height:10px}input[type=file]{display:none}.kbd{font-size:10px;background:#2b263c;border-radius:6px;padding:3px 6px;color:#c4b6e0}.warning{color:var(--amber)}.subheading{font-size:22px;font-weight:900;letter-spacing:-.7px;margin:4px 0 8px}.footer{font-size:10px;color:#595971;text-align:center;margin:29px 0 0}.split{display:flex;justify-content:space-between;align-items:center;gap:8px}.divider{height:1px;background:#2d2b3d;margin:15px 0}@media(min-width:600px){.app{border-left:1px solid #2a293b;border-right:1px solid #2a293b}.page{padding:27px 27px 25px}.nav{padding-left:22px;padding-right:22px}}@media(max-width:350px){.page{padding:18px 13px}.stat .num{font-size:21px}.hero-title{font-size:21px}}
  </style>

<body>
<div id="app" class="app"></div>
<script>
(()=>{
'use strict';
const KEY='pf_posto_fitness_v1';
const TODAY=()=>new Date().toLocaleDateString('sv-SE');
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const N=(x)=>Number(x)||0;
const escapeHtml=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v)=>Math.round(N(v)).toLocaleString('ro-RO');
const dayText=(str)=>new Date(str+'T12:00:00').toLocaleDateString('ro-RO',{weekday:'long',day:'numeric',month:'long'});
const dateShift=(date,n)=>{let x=new Date(date+'T12:00:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('sv-SE')};
const initial=()=>({version:1,profile:{name:'',goal:'masa',level:'incepator',equipment:'sala',days:4,calories:2400,protein:150,carbs:250,fats:75,waterGoal:2500,weightGoal:75},water:[],meals:[],workouts:[],body:[],createdAt:new Date().toISOString()});
let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null');if(!db||typeof db!=='object')db=initial()}catch(e){db=initial()}
const normalize=()=>{let d=initial();db={...d,...db,profile:{...d.profile,...(db.profile||{})}};['water','meals','workouts','body'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]})};normalize();
let tab='home',selected=TODAY(),mealCat='mic-dejun',workoutMode='today',activeWorkout=null,modal='',calendarMonth=TODAY().slice(0,7),toastTimer=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){notify('Spațiul de stocare este indisponibil. Exportă datele!')}};
const notify=(msg)=>{let t=document.querySelector('.toast');if(t)t.remove();t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),2800)};
const root=document.getElementById('app');
const getMeals=(d=selected)=>db.meals.filter(x=>x.date===d);
const getWater=(d=selected)=>db.water.filter(x=>x.date===d).reduce((sum,x)=>sum+N(x.ml),0);
const sumMeals=(d=selected)=>getMeals(d).reduce((s,m)=>({calories:s.calories+N(m.calories),protein:s.protein+N(m.protein),carbs:s.carbs+N(m.carbs),fats:s.fats+N(m.fats)}),{calories:0,protein:0,carbs:0,fats:0});
const doneWorkouts=(d)=>db.workouts.filter(x=>x.date===d&&x.status==='done');
const completion=(w)=>w.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);
const totalSets=(w)=>w.exercises.reduce((n,e)=>n+e.sets.length,0);
const progress=(v,total)=>Math.max(0,Math.min(100,Math.round(N(v)/Math.max(1,N(total))*100)));
const header=()=>`<div class="header"><div class="brand"><div class="logo">PF</div><div><b>POSTO FITNESS</b><small>STRONGER EVERY DAY</small></div></div><button class="avatar" data-act="tab" data-value="profile" aria-label="Profil">${escapeHtml((db.profile.name||'P').charAt(0).toUpperCase())}</button></div>`;
const nav=()=>`<nav class="nav">${[['home','⌂','Acasă'],['workout','🏋','Antrenament'],['food','◉','Mese'],['progress','▥','Progres'],['profile','⚙','Profil']].map(([id,ico,title])=>`<button data-act="tab" data-value="${id}" class="${tab===id?'active':''}"><span class="ico">${ico}</span><span>${title}</span></button>`).join('')}</nav>`;
const sectionHead=(title,link='',action='',value='')=>`<div class="section-head"><h2>${title}</h2>${link?`<button class="textbtn" data-act="${action}" data-value="${value}">${link} →</button>`:''}</div>`;
const empty=(emoji,title,sub)=>`<div class="empty"><div class="symbol">${emoji}</div><b>${title}</b><div class="small">${sub}</div></div>`;
const waterCard=()=>{let got=getWater(),goal=N(db.profile.waterGoal);return `<div class="panel"><div class="row between"><div><div class="eyebrow">HIDRATARE</div><h2 style="margin-top:7px">💧 Apa de azi</h2><div style="font-size:25px;font-weight:900;margin:13px 0 1px">${(got/1000).toLocaleString('ro-RO',{maximumFractionDigits:2})} <span class="muted" style="font-size:13px">/ ${(goal/1000).toLocaleString('ro-RO')} L</span></div><div class="muted small">${Math.max(0,goal-got)} ml rămași</div></div><div class="ring" style="--pct:${progress(got,goal)};width:85px;height:85px;background:conic-gradient(var(--teal) calc(var(--pct)*1%),#273c43 0)"><div><strong style="font-size:18px">${progress(got,goal)}%</strong><small>obiectiv</small></div></div></div><div class="progress" style="margin-top:15px"><div class="fill teal" style="width:${progress(got,goal)}%"></div></div><div class="row wrap" style="margin-top:14px"><button class="quick" data-act="water" data-value="250">+ 250 ml</button><button class="quick" data-act="water" data-value="500">+ 500 ml</button><button class="quick" data-act="modal" data-value="water">Altă cantitate +</button>${db.water.some(x=>x.date===selected)?`<button class="textbtn" data-act="undoWater">Anulează ultima</button>`:''}</div></div>`};
const mealEntries=(limit=99)=>{let list=getMeals().slice().reverse().slice(0,limit);if(!list.length)return empty('🥑','Nicio masă înregistrată','Adaugă prima masă ca să urmărești caloriile.');return list.map(m=>`<div class="entry"><div class="entry-icon">${({'mic-dejun':'🍳','pranz':'🥗','cina':'🍽️','gustare':'🍎'})[m.category]||'🥘'}</div><div class="entry-content"><b>${escapeHtml(m.name)}</b><small>${({'mic-dejun':'Mic dejun','pranz':'Prânz','cina':'Cină','gustare':'Gustare'})[m.category]||'Masă'} · P ${fmt(m.protein)}g · C ${fmt(m.carbs)}g · G ${fmt(m.fats)}g</small></div><div class="value">${fmt(m.calories)} kcal</div><button class="textbtn" title="Șterge" data-act="deleteMeal" data-value="${m.id}">×</button></div>`).join('')};
const home=()=>{const m=sumMeals(),dateName=selected===TODAY()?'azi':dayText(selected);let w=doneWorkouts(selected);let last=[...db.body].sort((a,b)=>b.date.localeCompare(a.date))[0];return `${header()}<div class="row between"><div><div class="eyebrow">BUN VENIT ${escapeHtml(db.profile.name||'ÎN PF')} 👋</div><h1 style="margin-top:7px">Hai să progresăm.</h1><p class="muted small" style="margin-top:5px">Tot ce contează pentru tine, într-un loc.</p></div></div>${dateBar()}<div class="hero"><div class="eyebrow" style="color:#cfb7ff">MISIUNEA ZILEI</div><div class="hero-title">Fiecare repetare contează. 💪</div><button class="btn" data-act="tab" data-value="workout">${w.length?'Vezi antrenamentele':'Începe antrenamentul'} <span>→</span></button></div><div class="section">${sectionHead('Rezumatul zilei')}<div class="grid2"><div class="stat"><div class="label">🔥 Calorii</div><div class="num">${fmt(m.calories)}</div><div class="sub">din ${fmt(db.profile.calories)} kcal</div><div class="progress" style="margin-top:12px"><div class="fill" style="width:${progress(m.calories,db.profile.calories)}%"></div></div></div><div class="stat"><div class="label">💪 Proteină</div><div class="num">${fmt(m.protein)} <span style="font-size:12px">g</span></div><div class="sub">din ${fmt(db.profile.protein)} g</div><div class="progress" style="margin-top:12px"><div class="fill teal" style="width:${progress(m.protein,db.profile.protein)}%"></div></div></div><div class="stat"><div class="label">🏋 Antrenamente</div><div class="num">${w.length}</div><div class="sub">finalizate ${dateName}</div></div><div class="stat"><div class="label">⚖ Greutate</div><div class="num">${last?N(last.kg).toLocaleString('ro-RO',{maximumFractionDigits:1}):'—'} <span style="font-size:12px">${last?'kg':''}</span></div><div class="sub">${last?'ultima cântărire':'adaugă o măsurătoare'}</div></div></div></div><div class="section">${waterCard()}</div><div class="section">${sectionHead('Mesele zilei','Toate','tab','food')}<div class="panel">${mealEntries(3)}<button class="btn secondary full" style="margin-top:14px" data-act="modal" data-value="meal">+ Adaugă masă</button></div></div>${footer()}`};
const dateBar=()=>`<div class="datebar"><button class="arrowbtn" data-act="shiftDate" data-value="-1">‹</button><button class="date-pill" data-act="chooseToday">📅 ${escapeHtml(selected===TODAY()?'Astăzi, '+dayText(selected):dayText(selected))} ▾</button><button class="arrowbtn" data-act="shiftDate" data-value="1">›</button></div>`;

const sheet=(title,body)=>`<div class="overlay" id="overlay" data-overlay="true"><div class="sheet"><div class="sheetheader"><h2>${title}</h2><button class="iconbtn" data-act="close" aria-label="Închide">×</button></div>${body}</div></div>`;
const renderModal=()=>{if(!modal)return '';if(modal==='water')return sheet('💧 Adaugă apă',`<form class="form" id="waterForm"><label>Cantitate (ml)<input name="ml" type="number" inputmode="numeric" min="1" max="5000" step="50" value="300" required/></label><button class="btn full" type="submit">+ Înregistrează apa</button></form>`);if(modal==='meal')return sheet('🥗 Adaugă o masă',`<form class="form" id="mealForm"><label>Tipul mesei<select name="category"><option value="mic-dejun">Mic dejun</option><option value="pranz">Prânz</option><option value="cina">Cină</option><option value="gustare">Gustare</option></select></label><label>Ce ai mâncat?<input name="name" placeholder="Ex. Orez cu pui" maxlength="80" required/></label><label>Calorii (kcal)<input name="calories" type="number" inputmode="numeric" min="0" max="10000" required placeholder="Ex. 450"/></label><div class="formline"><label>Proteină (g)<input name="protein" type="number" inputmode="decimal" min="0" max="1000" step="0.1" placeholder="0"/></label><label>Carbohidrați (g)<input name="carbs" type="number" inputmode="decimal" min="0" max="1000" step="0.1" placeholder="0"/></label></div><label>Grăsimi (g)<input name="fats" type="number" inputmode="decimal" min="0" max="500" step="0.1" placeholder="0"/></label><button class="btn full" type="submit">+ Salvează masa</button></form>`);if(modal==='quickMeal'){let items=[['Ou fiert','🥚',78,6.3,.6,5.3],['Banană medie','🍌',105,1.3,27,.4],['Iaurt grecesc 150 g','🥣',130,15,6,5],['Piept de pui 100 g','🍗',165,31,0,3.6],['Orez fiert 100 g','🍚',130,2.7,28,.3],['Măr mediu','🍎',95,.5,25,.3],['Ovăz 50 g','🌾',190,6.5,33,3.5],['Pâine 1 felie','🍞',80,3,15,1]];return sheet('⚡ Alimente rapide',`<p class="notice" style="margin-bottom:15px">Valori aproximative pentru porțiile descrise. Verifică eticheta produsului.</p>${items.map((x,i)=>`<div class="entry"><div class="entry-icon">${x[1]}</div><div class="entry-content"><b>${x[0]}</b><small>P ${x[3]}g · C ${x[4]}g · G ${x[5]}g</small></div><b class="small">${x[2]} kcal</b><button class="btn sm" data-act="quickFood" data-value="${i}">+</button></div>`).join('')}`)}if(modal==='weight')return sheet('⚖ Adaugă greutatea',`<form class="form" id="weightForm"><label>Data<input name="date" type="date" value="${selected}" max="${dateShift(TODAY(),365)}" required/></label><label>Greutate (kg)<input name="kg" type="number" inputmode="decimal" min="20" max="500" step="0.1" placeholder="Ex. 75.5" required/></label><button class="btn full" type="submit">✓ Salvează măsurătoarea</button></form>`);if(modal==='exercise')return sheet('🏋 Adaugă exercițiu',`<form id="exerciseForm" class="form"><label>Numele exercițiului<input name="name" maxlength="80" placeholder="Ex. Tracțiuni" required/></label><div class="formline"><label>Număr serii<input name="sets" type="number" min="1" max="12" value="3" required/></label><label>Repetări / secunde<input name="reps" type="number" min="1" max="500" value="10" required/></label></div><button class="btn full" type="submit">+ Adaugă exercițiul</button></form>`);if(modal==='confirmReset')return sheet('⚠ Ștergi toate datele?',`<p class="small muted">Vei pierde definitiv toate mesele, antrenamentele, apa, greutatea și preferințele salvate în acest browser. Exportă mai întâi un backup.</p><div class="row" style="margin-top:23px"><button class="btn secondary" data-act="close" style="flex:1">Anulează</button><button class="btn danger" data-act="confirmReset" style="flex:1">Șterge tot</button></div>`);if(modal==='date')return sheet('📅 Alege data',`<form id="dateForm" class="form"><label>Data jurnalului<input type="date" name="date" value="${selected}" required/></label><button class="btn full" type="submit">Alege data</button><button class="btn secondary full" type="button" data-act="today">Mergi la astăzi</button></form>`);return ''};
const render=()=>{let pages={home,workout,food,progress:progressPage,profile};root.innerHTML=`<main class="page">${(pages[tab]||home)()}</main>${nav()}${renderModal()}`};
const addWater=(ml)=>{db.water.push({id:uid(),date:selected,ml:N(ml)});save();render();notify(`+ ${ml} ml apă înregistrată 💧`)};
const gen=(split)=>{if(activeWorkout&&!confirm('Înlocuiești antrenamentul început?'))return;let choices=splits(N(db.profile.days));activeWorkout=makeWorkout(split||choices[doneWorkouts(selected).length%choices.length]);tab='workout';render();notify('Antrenamentul a fost generat!')};
const modalClose=()=>{modal='';render()};
const actions={tab:v=>{tab=v;modal='';render();window.scrollTo(0,0)},modal:v=>{modal=v;render()},close:modalClose,water:v=>addWater(v),undoWater:()=>{let i=db.water.findLastIndex?db.water.findLastIndex(x=>x.date===selected):db.water.map(x=>x.date).lastIndexOf(selected);if(i>=0){db.water.splice(i,1);save();render();notify('Ultima cantitate a fost eliminată.')}},shiftDate:v=>{selected=dateShift(selected,N(v));calendarMonth=selected.slice(0,7);render()},chooseToday:()=>{modal='date';render()},today:()=>{selected=TODAY();calendarMonth=selected.slice(0,7);modalClose()},selectDate:v=>{selected=v;calendarMonth=v.slice(0,7);tab='progress';render()},shiftMonth:v=>{let [y,m]=calendarMonth.split('-').map(Number);let d=new Date(y,m-1+N(v),1);calendarMonth=d.toLocaleDateString('sv-SE').slice(0,7);render()},generate:()=>gen(),generateSplit:v=>gen(v),newCustom:()=>{if(activeWorkout&&!confirm('Înlocuiești antrenamentul început?'))return;activeWorkout={id:uid(),date:selected,name:'Antrenament personalizat',source:'manual',status:'planned',exercises:[]};modal='exercise';render()},discardWorkout:()=>{if(confirm('Renunți la antrenamentul curent?')){activeWorkout=null;render()}},removeExercise:v=>{if(!activeWorkout)return;activeWorkout.exercises.splice(N(v),1);render()},addSet:v=>{let ex=activeWorkout?.exercises[N(v)];if(!ex)return;let last=ex.sets[ex.sets.length-1]||{reps:10,kg:0};ex.sets.push({...last,done:false});render()},toggleSet:v=>{if(!activeWorkout)return;let [i,j]=v.split(':').map(Number);let s=activeWorkout.exercises[i]?.sets[j];if(!s)return;s.done=!s.done;render()},finishWorkout:()=>{let w=activeWorkout;if(!w||!w.exercises.length){notify('Adaugă măcar un exercițiu.');return}if(!completion(w)&&!confirm('Nu ai bifat nicio serie. Finalizezi totuși?'))return;db.workouts.push({...w,status:'done',completedAt:new Date().toISOString()});activeWorkout=null;save();render();notify('Felicitări! Antrenament salvat 🏆')},deleteMeal:v=>{db.meals=db.meals.filter(x=>x.id!==v);save();render();notify('Masa a fost ștearsă.')},deleteWorkout:v=>{if(!confirm('Ștergi acest antrenament din istoric?'))return;db.workouts=db.workouts.filter(x=>x.id!==v);save();render()},deleteWeight:v=>{db.body=db.body.filter(x=>x.id!==v);save();render()},quickFood:v=>{const a=[['Ou fiert',78,6.3,.6,5.3],['Banană medie',105,1.3,27,.4],['Iaurt grecesc 150 g',130,15,6,5],['Piept de pui 100 g',165,31,0,3.6],['Orez fiert 100 g',130,2.7,28,.3],['Măr mediu',95,.5,25,.3],['Ovăz 50 g',190,6.5,33,3.5],['Pâine 1 felie',80,3,15,1]];let x=a[N(v)];if(!x)return;db.meals.push({id:uid(),date:selected,name:x[0],calories:x[1],protein:x[2],carbs:x[3],fats:x[4],category:'gustare'});save();modalClose();notify('Aliment adăugat!')},export:()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`PF-Posto-Fitness-backup-${TODAY()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);notify('Backup exportat!')},import:()=>document.getElementById('importFile')?.click(),reset:()=>{modal='confirmReset';render()},confirmReset:()=>{db=initial();activeWorkout=null;selected=TODAY();calendarMonth=selected.slice(0,7);tab='home';modal='';save();render();notify('Datele au fost șterse.')}};
root.addEventListener('click',e=>{const btn=e.target.closest('[data-act]');if(btn){e.preventDefault();let f=actions[btn.dataset.act];if(f)f(btn.dataset.value);return}if(e.target.matches('[data-overlay]'))modalClose()});
root.addEventListener('change',e=>{if(e.target.matches('[data-set-field]')&&activeWorkout){let el=e.target,ex=activeWorkout.exercises[N(el.dataset.ex)],set=ex?.sets[N(el.dataset.set)];if(set){let x=N(el.value);set[el.dataset.setField]=Math.max(0,Math.min(999,x));}}if(e.target.id==='importFile'){let file=e.target.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!data||!Array.isArray(data.meals)||!Array.isArray(data.water)||!Array.isArray(data.workouts)||!Array.isArray(data.body)||typeof data.profile!=='object')throw new Error('format');if(!confirm('Importul înlocuiește toate datele locale. Continui?'))return;db=data;normalize();activeWorkout=null;save();render();notify('Backup restaurat!')}catch(err){notify('Fișier JSON invalid.')}};reader.readAsText(file);}});
root.addEventListener('submit',e=>{e.preventDefault();const form=e.target;const data=Object.fromEntries(new FormData(form));if(form.id==='waterForm'){let ml=N(data.ml);if(ml>0&&ml<=5000){modal='';addWater(ml)}return}if(form.id==='mealForm'){if(!data.name?.trim())return;db.meals.push({id:uid(),date:selected,category:data.category,name:data.name.trim(),calories:N(data.calories),protein:N(data.protein),carbs:N(data.carbs),fats:N(data.fats)});save();modalClose();notify('Masa a fost înregistrată 🍽️');return}if(form.id==='weightForm'){let kg=N(data.kg);if(kg<20||kg>500)return;db.body.push({id:uid(),date:data.date,kg});save();modalClose();notify('Greutatea a fost înregistrată.');return}if(form.id==='dateForm'){selected=data.date;calendarMonth=selected.slice(0,7);modalClose();return}if(form.id==='exerciseForm'){if(!activeWorkout)return;let sets=Math.max(1,Math.min(12,N(data.sets))),reps=Math.max(1,Math.min(500,N(data.reps)));activeWorkout.exercises.push({id:uid(),name:data.name.trim(),sets:Array.from({length:sets},()=>({reps,kg:0,done:false}))});modalClose();notify('Exercițiu adăugat!');return}if(form.id==='profileForm'){let numeric=['days','calories','protein','carbs','fats','waterGoal','weightGoal'];for(let k of numeric)data[k]=N(data[k]);db.profile={...db.profile,...data};save();render();notify('Obiectivele au fost salvate 💜');return}});
render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
